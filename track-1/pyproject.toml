[project]
name = "track-1-telco-churn-mlops"
version = "0.1.0"
description = "Week 17 MLOps Track A: Telco Customer Churn with uv, MLflow, FastAPI, Evidently"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "mlflow>=2.12",
    "evidently>=0.7.0",
    "fastapi>=0.109",
    "uvicorn>=0.25",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "joblib>=1.3",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
